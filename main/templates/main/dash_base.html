<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <nav class="d-flex gap-3 mb-4 align-items-center">
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'dashboard_projects' %}">Projects</a>
    <a href="{% url 'dashboard_techstacks' %}">Tech Stacks</a>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}" class="ms-auto">
      {% csrf_token %}<button class="btn btn-sm btn-outline-secondary">Logout</button>
    </form>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
