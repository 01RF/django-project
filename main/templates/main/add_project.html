<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background-color:#1a1a1a;
            color:white;
        }

        .navbar{
            background-color:#111111;
        }

        .form-card{
            background-color:#2b2b2b;
            border:1px solid #555;
            border-radius:12px;
            padding:30px;
            margin-top:50px;
        }

        .form-control{
            background-color:#3a3a3a;
            color:white;
            border:1px solid #666;
        }

        .form-control:focus{
            background-color:#3a3a3a;
            color:white;
            border-color:white;
            box-shadow:none;
        }

        label{
            margin-top:10px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">
            My Portfolio
        </a>

    </div>

</nav>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="form-card">

                <h2 class="text-center mb-4">
                    Add New Project
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="d-grid gap-2">

                        <button class="btn btn-light">

                            Add Project

                        </button>

                        <a href="{% url 'project_list' %}" class="btn btn-outline-light">

                            Back to Projects

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
